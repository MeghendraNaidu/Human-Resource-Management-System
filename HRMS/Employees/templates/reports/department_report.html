{% extends "base.html" %}

{% block title %}Department Report | HRMS{% endblock %}

{% block content %}
<h2 class="mb-4">Department-wise Employee Count</h2>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Department</th>
            <th>Employee Count</th>
        </tr>
    </thead>
    <tbody>
        {% for row in report %}
        <tr>
            <td>{{ row.department }}</td>
            <td>{{ row.employee_count }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center text-muted">
                No data available.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
